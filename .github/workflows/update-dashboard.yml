name: Update Dashboard

on:
  schedule:
    - cron: '0 14 * * *'  # UTC 14:00 = 墨西哥时间 08:00
  workflow_dispatch:       # 手动触发

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TK_APP_KEY: ${{ secrets.TK_APP_KEY }}
      TK_APP_SECRET: ${{ secrets.TK_APP_SECRET }}
      TK_ACCESS_TOKEN: ${{ secrets.TK_ACCESS_TOKEN }}
      TK_REFRESH_TOKEN: ${{ secrets.TK_REFRESH_TOKEN }}
      TK_ACCESS_TOKEN_EXPIRE: ${{ secrets.TK_ACCESS_TOKEN_EXPIRE }}
      TK_REFRESH_TOKEN_EXPIRE: ${{ secrets.TK_REFRESH_TOKEN_EXPIRE }}
      DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
      MONITOR_DIR: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Generate dashboard
        id: gen
        run: python generate_dashboard.py

      - name: Update secrets if token refreshed
        if: steps.gen.outputs.access_token != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const secrets = {
              TK_ACCESS_TOKEN: '${{ steps.gen.outputs.access_token }}',
              TK_REFRESH_TOKEN: '${{ steps.gen.outputs.refresh_token }}',
              TK_ACCESS_TOKEN_EXPIRE: '${{ steps.gen.outputs.access_token_expire_in }}',
              TK_REFRESH_TOKEN_EXPIRE: '${{ steps.gen.outputs.refresh_token_expire_in }}',
            };
            const sodium = require('tweetsodium');
            const { data: { key, key_id } } = await github.rest.actions.getRepoPublicKey({
              owner: context.repo.owner, repo: context.repo.repo
            });
            for (const [name, value] of Object.entries(secrets)) {
              if (!value) continue;
              const enc = Buffer.from(sodium.seal(Buffer.from(value), Buffer.from(key, 'base64'))).toString('base64');
              await github.rest.actions.createOrUpdateRepoSecret({
                owner: context.repo.owner, repo: context.repo.repo,
                secret_name: name, encrypted_value: enc, key_id
              });
            }

      - name: Deploy to GitHub Pages
        run: |
          cd docs
          git init
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Update dashboard $(date -u +%Y-%m-%d)"
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:gh-pages
