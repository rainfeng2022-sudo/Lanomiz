name: Update Dashboard

on:
  schedule:
    - cron: '6 6 * * *'   # UTC 06:06 = 墨西哥时间 00:06（抓昨天完整数据）
    - cron: '0 4 * * *'   # UTC 04:00 = 墨西哥时间 22:00（抓今天大部分数据）
  workflow_dispatch:       # 手动触发

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TK_APP_KEY: ${{ secrets.TK_APP_KEY }}
      TK_APP_SECRET: ${{ secrets.TK_APP_SECRET }}
      TK_ACCESS_TOKEN: ${{ secrets.TK_ACCESS_TOKEN }}
      TK_REFRESH_TOKEN: ${{ secrets.TK_REFRESH_TOKEN }}
      TK_ACCESS_TOKEN_EXPIRE: ${{ secrets.TK_ACCESS_TOKEN_EXPIRE }}
      TK_REFRESH_TOKEN_EXPIRE: ${{ secrets.TK_REFRESH_TOKEN_EXPIRE }}
      DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
      MONITOR_DIR: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Generate dashboard
        id: gen
        run: python generate_dashboard.py

      - name: Update secrets if token refreshed
        if: steps.gen.outputs.access_token != ''
        uses: hmanzur/actions-set-secret@v2.0.0
        with:
          token: ${{ secrets.GH_PAT }}
          repository: ${{ github.repository }}
          name: TK_ACCESS_TOKEN
          value: ${{ steps.gen.outputs.access_token }}

      - name: Update refresh token secret
        if: steps.gen.outputs.access_token != ''
        uses: hmanzur/actions-set-secret@v2.0.0
        with:
          token: ${{ secrets.GH_PAT }}
          repository: ${{ github.repository }}
          name: TK_REFRESH_TOKEN
          value: ${{ steps.gen.outputs.refresh_token }}

      - name: Update token expire secrets
        if: steps.gen.outputs.access_token != ''
        uses: hmanzur/actions-set-secret@v2.0.0
        with:
          token: ${{ secrets.GH_PAT }}
          repository: ${{ github.repository }}
          name: TK_ACCESS_TOKEN_EXPIRE
          value: ${{ steps.gen.outputs.access_token_expire_in }}

      - name: Update refresh token expire secret
        if: steps.gen.outputs.access_token != ''
        uses: hmanzur/actions-set-secret@v2.0.0
        with:
          token: ${{ secrets.GH_PAT }}
          repository: ${{ github.repository }}
          name: TK_REFRESH_TOKEN_EXPIRE
          value: ${{ steps.gen.outputs.refresh_token_expire_in }}

      - name: Deploy to GitHub Pages
        run: |
          cd docs
          git init
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Update dashboard $(date -u +%Y-%m-%d)"
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:gh-pages
